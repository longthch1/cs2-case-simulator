name: PHP lint

on:
  push:
    branches: ["feature/php-mysql-apache", "main"]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: \${{ matrix.php }}
      - name: Lint PHP
        run: |
          set -e
          find src public database deploy -type f -name "*.php" -print0 | xargs -0 -n1 php -l
