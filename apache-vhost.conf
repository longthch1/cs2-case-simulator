# ==============================================================================
# CS2 Case Opening Simulator — Apache VirtualHost Configuration
# For standalone Apache (e.g., C:/xampp/apache/conf/extra/httpd-vhosts.conf or Linux /etc/apache2/sites-available/)
# ==============================================================================

<VirtualHost *:80>
    ServerName cs2sim.local
    ServerAlias localhost 127.0.0.1
    DocumentRoot "C:/Users/longt/.gemini/antigravity/scratch/cs2-case-simulator-php"

    <Directory "C:/Users/longt/.gemini/antigravity/scratch/cs2-case-simulator-php">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Pass Authorization header to PHP
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    # Custom Logs
    ErrorLog "logs/cs2_error.log"
    CustomLog "logs/cs2_access.log" combined

    # Enable Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript
    </IfModule>
</VirtualHost>
