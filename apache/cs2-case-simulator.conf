<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    DocumentRoot /var/www/cs2-case-simulator/public

    <Directory /var/www/cs2-case-simulator/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/cs2-case-simulator/(src|database|storage|logs)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog /var/log/apache2/cs2-case-simulator-error.log
    CustomLog /var/log/apache2/cs2-case-simulator-access.log combined
</VirtualHost>
