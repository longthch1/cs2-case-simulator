# ==============================================================================
# CS2 Case Opening Simulator — Apache Site Configuration for Ubuntu / Debian
# Path: /etc/apache2/sites-available/cs2-simulator.conf
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin admin@cs2sim.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        # Pass HTTP Authorization header to PHP (Crucial for JWT Bearer Tokens)
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/cs2_error.log
    CustomLog ${APACHE_LOG_DIR}/cs2_access.log combined

    # Gzip / Deflate Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript
    </IfModule>

    # Static Assets Caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>
